baseURL = 'https://blog.andreani.in/'
languageCode = 'en-us'
title = 'Gonzalo Andreani'
buildFuture = true

[params]
  author = 'Gonzalo Andreani'
  description = 'Android Engineer'

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    noClasses = false  # Use CSS classes (Pygments-compatible)
    style = 'pygments'

  [markup.goldmark.renderer]
    unsafe = true  # Allow raw HTML in markdown

  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
